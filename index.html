    <script>
      /* Fix for browser extensions attempting to assign to window.fetch when it only has a getter */
      (function() {
        try {
          var realFetch = window.fetch;
          var customFetch = realFetch ? realFetch.bind(window) : undefined;
          
          // Define a writable and configurable fetch on window
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch;
            },
            set: function(newFetch) {
              customFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Ignore if environment forbids redefinition
        }

        // Suppress unhandled errors from injected third-party browser extensions
        window.addEventListener('error', function(e) {
          if (
            (e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
            (e.message && (
              e.message.indexOf('Cannot set property fetch') !== -1 ||
              e.message.indexOf('which has only a getter') !== -1
            ))
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var msg = (e.reason && (e.reason.message || e.reason.stack)) || '';
          if (
            msg.indexOf('chrome-extension://') !== -1 ||
            msg.indexOf('Cannot set property fetch') !== -1
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
